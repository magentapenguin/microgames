<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Safe Cracker</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                width: 100%;
                height: 100%;
                background: #111;
                color: white;
                font-family: 'Space Mono', monospace;
            }
            body {
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: space-around;
            }
            #keypad {
                display: grid;
                grid-template-columns: repeat(3, 80px);
                gap: 10px;
                --color: #555;
            }
            #current-guess {
                text-align: center;
                font-size: 2em;
                grid-column: span 3;
                height: 50px;
                border-radius: 5px;
                background: black;
                color: color-mix(var(--color), white 40%);
            }
            .keypad-button {
                width: 80px;
                height: 80px;
                font-size: 1.5em;
                background: var(--bg-color, none);
                border: none;
                color: color-mix(var(--bg-color, var(--color)), white 50%);
                cursor: pointer;
                box-shadow: 0 5px 6px -3px var(--color);
                transition: all 0.1s ease;
                border-radius: 10px;
            }
            .keypad-button:active {
                box-shadow: 0 2px 3px -1px var(--color);
                transform: translateY(2px);
            }
            .keypad-button:disabled {
                color: color-mix(var(--bg-color, var(--color)), white 20%);
                cursor: not-allowed;
            }
            .keypad-button:hover:not(:disabled) {
                background: color-mix(var(--bg-color, transparent), white 10%);
            }
            #guessed {
                font-size: 1.2em;
                display: flex;
                flex-direction: column;
                overflow-y: scroll;
                scrollbar-width: thin;
                color-scheme: dark;
                gap: 2px;
                width: 200px;
                height: 80vh;
            }
            #guessed div {
                margin: 1px;
                text-align: center;
            }
            .number {
                border-radius: 5px;
                padding: 1px 4px;
                background: #333;
                margin: 1px;
                font-variant-numeric: tabular-nums;
            }
            #timer {
                position: fixed;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 1.5em;
            }
        </style>
    <script src="/static/back.js"></script>
    </head>
    <body>
        <div id="timer"></div>
        <div id="keypad">
            <div id="current-guess"></div>
        </div>
        <div id="guessed"></div>
        <script>
            const keypad = document.getElementById("keypad");
            const currentGuess = document.getElementById("current-guess");
            let length = 2;
            let guess = "";
            let guessed = [];
            let secret = "";
            let cracked = 0;
            let timeLimit = 30000; // 30 seconds
            let startTime = performance.now();
            currentGuess.textContent = "_".repeat(length);
            currentGuess.innerHTML = currentGuess.textContent.replaceAll("_", '<span style="color:#222">_</span>');
            function generateSecret() {
                secret = "";
                for (let i = 0; i < length; i++) {
                    secret += Math.floor(Math.random() * 10);
                }
            }
            let knowledge = Array(10).fill(null);
            function updateGuessed() {
                document.getElementById("guessed").innerHTML = "";
                Array.from(guessed)
                    .reverse()
                    .forEach((g) => {
                        const div = document.createElement("div");
                        // Highlight correct digits
                        let highlighted = "";
                        for (let i = 0; i < g.length; i++) {
                            if (g[i] === secret[i]) {
                                highlighted += `<span style="background:#080" class="number">${g[i]}</span>`;
                                knowledge[g[i]] = { digit: g[i], correct: true, present: true };
                            } else if (Array.from(secret).includes(g[i])) {
                                highlighted += `<span style="background:#088" class="number">${g[i]}</span>`;
                                if (!knowledge[g[i]] || !knowledge[g[i]].correct) {
                                    knowledge[g[i]] = { digit: g[i], correct: false, present: true };
                                }
                            } else {
                                highlighted += `<span class="number">${g[i]}</span>`;
                                if (!knowledge[g[i]]) {
                                    knowledge[g[i]] = { digit: g[i], correct: false, present: false };
                                }
                            }
                        }
                        div.innerHTML = highlighted;
                        document.getElementById("guessed").appendChild(div);
                    });
            }
            let lastSecond = 0;
            function updateTimer() {
                const elapsed = performance.now() - startTime;
                const remaining = Math.max(0, timeLimit - elapsed);
                document.getElementById("timer").textContent = `${(remaining / 1000).toFixed(2)}s`;
                if (Math.floor(remaining / 1000) !== lastSecond) {
                    playTick();
                    lastSecond = Math.floor(remaining / 1000);
                }
                if (remaining > 0) {
                    requestAnimationFrame(updateTimer);
                } else {
                    alert(`Time's up! You cracked ${cracked} safes. The last code was ${secret}.`);
                    // Reset game
                    cracked = 0;
                    length = 2;
                    guessed = [];
                    knowledge = Array(length).fill(null);
                    document.getElementById("guessed").innerHTML = "";
                    document.getElementById("timer").textContent = "";
                    document.querySelectorAll(".keypad-button").forEach((button) => (button.disabled = false));
                    document.getElementById("current-guess").textContent = "_".repeat(length);
                    currentGuess.innerHTML = currentGuess.textContent.replaceAll("_", '<span style="color:#222">_</span>');
                    startTime = performance.now();
                    generateSecret();
                    updateTimer();
                    onClick();
                }
            }
            requestAnimationFrame(updateTimer);
            generateSecret();

            function onClick() {
                function setButtonsDisabled(disabled) {
                    const buttons = document.querySelectorAll(".keypad-button");
                    buttons.forEach((button) => (button.disabled = disabled));
                }
                currentGuess.textContent = guess.padEnd(length, "_");
                if (guess.length === length) {
                    setButtonsDisabled(true);
                    guessed.push(guess);
                    updateGuessed();
                    if (guess === secret) {
                        cracked++;
                        length++;
                        keypad.style.setProperty("--color", "#0f8");
                        setTimeout(() => {
                            keypad.style.removeProperty("--color");
                            currentGuess.textContent = "_".repeat(length);
                            currentGuess.innerHTML = currentGuess.textContent.replaceAll("_", '<span style="color:#222">_</span>');
                            setButtonsDisabled(false);
                            startTime = performance.now();
                        }, 200);
                        generateSecret();
                        knowledge = Array(length).fill(null);
                        guessed = [];
                        document.getElementById("guessed").innerHTML = "";
                        playCorrect();
                    } else {
                        keypad.style.setProperty("--color", "#f20");
                        setTimeout(() => {
                            keypad.style.removeProperty("--color");
                            currentGuess.textContent = "_".repeat(length);
                            currentGuess.innerHTML = currentGuess.textContent.replaceAll("_", '<span style="color:#222">_</span>');
                            setButtonsDisabled(false);
                        }, 200);
                        playIncorrect();
                    }
                    guess = "";
                }
                // Update button states based on knowledge
                const buttons = document.querySelectorAll(".keypad-button");
                buttons.forEach((button) => {
                    const num = button.textContent;
                    const info = knowledge[num];
                    console.log(num, info);
                    if (info) {
                        if (info.correct) {
                            button.style.setProperty("--bg-color", "#040");
                        } else if (info.present) {
                            button.style.setProperty("--bg-color", "#044");
                        } else {
                            button.style.setProperty("--bg-color", "#222");
                        }
                    } else {
                        button.style.removeProperty("--bg-color");
                    }
                });
                currentGuess.innerHTML = currentGuess.textContent.replaceAll("_", '<span style="color:#222">_</span>');
            }

            function createButton(num) {
                const button = document.createElement("button");
                button.textContent = num;
                button.className = "keypad-button";
                button.addEventListener("click", () => {
                    guess += num;
                    playFrequency(200 + num * 20);
                    onClick();
                });
                return button;
            }

            const context = new AudioContext();
            
            function playTick() {
                const oscillator = context.createOscillator();
                // Create a quick tick sound
                oscillator.type = "triangle";
                oscillator.frequency.setValueAtTime(1000, context.currentTime);
                const gain = context.createGain();
                gain.gain.setValueAtTime(0.1, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.1);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 100);
            }

            function playFrequency(frequency, time = 100, volume = 0.1) {
                return new Promise((resolve) => {
                    const oscillator = context.createOscillator();
                    oscillator.type = "square";
                    oscillator.frequency.setValueAtTime(
                        frequency,
                        context.currentTime
                    );
                    const gain = context.createGain();
                    gain.gain.setValueAtTime(volume, context.currentTime);
                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        context.currentTime + time / 1000
                    );
                    oscillator.connect(gain);
                    gain.connect(context.destination);
                    oscillator.start();
                    setTimeout(() => {
                        oscillator.stop();
                        resolve();
                    }, time);
                });
            }

            function wait(ms) {
                return new Promise((resolve) => setTimeout(resolve, ms));
            }

            async function playCorrect() {
                await wait(120);
                await playFrequency(600);
                await playFrequency(800);
            }

            async function playIncorrect() {
                await wait(100);
                await playFrequency(80, 500);
            }

            for (let i = 1; i <= 9; i++) {
                keypad.appendChild(createButton(i));
            }

            const backspace = document.createElement("button");
            backspace.textContent = "⌫";
            backspace.className = "keypad-button";
            backspace.addEventListener("click", () => { 
                guess = guess.slice(0, -1);
                onClick();
            });

            keypad.appendChild(document.createElement("div"));
            keypad.appendChild(createButton(0));
            keypad.appendChild(backspace);

            document.addEventListener("keydown", (e) => {
                if (e.key >= "0" && e.key <= "9") {
                    const button = Array.from(document.querySelectorAll(".keypad-button")).find(
                        (btn) => btn.textContent === e.key
                    );
                    if (button && !button.disabled) {
                        button.click();
                    }
                } else if (e.key === "Backspace") {
                    backspace.click();
                }
            });
        </script>
    </body>
</html>
